  reason: not-a-software-company
  detail: >-
    Customer Database is an API Evangelist topic reference, not a company — apis.yml
    declares apis: [] and the profile exists to point at the vendors and open standards in
    the customer-data space, so there is no vendor, no host, and no API of its own to
    document. repair-api-bases.py returned "missing" and probe-domain-security.py returned
    "no-hosts" because no API entry names a base URL. The 14 artifacts added this pass are
    neutral, standards-grounded reference material (a vocabulary, a SCIM/vCard/Schema.org
    field crosswalk, five JSON Schemas, a JSON Structure, a JSON-LD context, a Spectral
    ruleset, examples and an llms.txt), not a vendor surface. See the individual vendor
    repositories — salesforce, hubspot, segment, customer-io, zendesk — for real APIs.
